services:
    nginx-service:
        image: nginx:latest
        restart: unless-stopped
        ports:
            - ${APP_PORT}:80
        volumes:
            - ./www:/var/www
            - ./nginx:/etc/nginx/conf.d
        depends_on:
            - php-service
            - db-service
        networks:
            - workspace

    php-service:
        build:
            context: .
            dockerfile: ./php/Dockerfile
            args:
                PHP_VERSION: ${PHP_VERSION}
        restart: unless-stopped
        ports:
            - ${PHP_PORT}:9000
        volumes:
            - ./www:/var/www
            - ./php/php.ini:/usr/local/etc/php/php.ini
        networks:
            - workspace

    db-service:
        image: mysql:8.0
        ports:
         - ${MYSQL_PORT}:3306
        volumes:
            - ./db/data:/var/lib/mysql
            - ./db/my.cnf:/etc/mysql/my.cnf
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        networks:
            - workspace

    cache-service:
        image: redis:latest
        restart: unless-stopped
        ports:
            - ${REDIS_PORT}:6379
        networks:
            - workspace


networks:
    workspace:

